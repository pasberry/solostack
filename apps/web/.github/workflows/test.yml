name: Test Suite
on:
  push:
    branches: [main, "workstream-*"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run lint --workspace=@solostack/web
      - run: npm run test --workspace=@solostack/web
